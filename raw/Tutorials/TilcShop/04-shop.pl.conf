<VirtualHost *:80>
        ServerName local.shop
        ServerAdmin admin@shop.pl
        ServerAlias local.shop
        DocumentRoot /var/www/shop.pl/public_html
        DirectoryIndex index.php index.html index.htm

        <Directory /var/www/shop.pl/private_html>
                Options Indexes FollowSymLinks
                AllowOverride All
                Require all granted
        </Directory>

        <Directory /var/www/shop.pl/public_html>
                Options Indexes FollowSymLinks
                AllowOverride All
                Require all granted
        </Directory>

        <Directory /var/www/shop.pl/public_html/fcgi>
                Options Indexes FollowSymLinks ExecCGI
                AllowOverride All
                Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/error-shop.pl.log
        CustomLog ${APACHE_LOG_DIR}/access-shop.pl.log combined
</VirtualHost>
